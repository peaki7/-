<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personality Insight — Scientific Test</title>
<style>
:root{--bg:#090909;--card:#121212;--gold:#d6ad55;--gold2:#f0d58a;--muted:#a7a7a7;--line:#292929}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#252016 0,#090909 42%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{width:min(720px,92%);margin:auto;padding:28px 0 50px}.brand{text-align:center;color:var(--gold2);font-weight:800;letter-spacing:2px;font-size:13px}
h1{font-size:30px;text-align:center;margin:10px 0 7px}.sub{text-align:center;color:var(--muted);line-height:1.7;margin:0 auto 24px}
.card{background:linear-gradient(145deg,#151515,#0f0f0f);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.timer{color:var(--gold2);font-variant-numeric:tabular-nums;font-weight:800}
.bar{height:6px;background:#242424;border-radius:99px;overflow:hidden;margin-bottom:25px}.fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:.3s}
.q{font-size:22px;line-height:1.5;font-weight:750;margin:8px 0 18px}.hint{color:#999;font-size:13px;margin-bottom:15px}
.option{width:100%;text-align:right;padding:16px 17px;margin:10px 0;border-radius:15px;border:1px solid #303030;background:#171717;color:#eee;font-size:16px;cursor:pointer;transition:.18s}
.option:hover{border-color:#92763a;transform:translateY(-1px)}.option.selected{border-color:var(--gold);background:#201b10;box-shadow:0 0 0 1px #d6ad5533}
.next{width:100%;margin-top:15px;padding:15px;border:0;border-radius:15px;background:linear-gradient(90deg,#b98d36,#efd078);color:#111;font-weight:900;font-size:16px;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none}.intro label{display:block;color:#ccc;font-size:14px;margin:13px 0 7px}.intro input{width:100%;padding:14px;border-radius:12px;border:1px solid #303030;background:#0d0d0d;color:#fff;font-size:16px}
.result h2{text-align:center;font-size:26px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.metric{border:1px solid var(--line);border-radius:15px;padding:14px}.metric b{display:flex;justify-content:space-between;font-size:14px}.track{height:7px;background:#242424;border-radius:99px;margin-top:9px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.box{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.box h3{margin:0 0 7px;color:var(--gold2)}.box p{color:#d0d0d0;line-height:1.8;margin:0}
.restart{margin-top:20px;background:#171717;color:#fff;border:1px solid #444;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%}
.small{text-align:center;color:#777;font-size:11px;line-height:1.7;margin-top:16px}
@media(max-width:520px){h1{font-size:25px}.q{font-size:19px}.scoregrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">PERSONALITY INSIGHT • SCIENTIFIC SELF‑REPORT</div>
<h1>اختبار الشخصية المختصر</h1>
<p class="sub">مبني على أبعاد الشخصية الخمسة الكبرى Big Five. اختر الإجابة الأقرب لك عادةً، وليس الإجابة التي تتمنى أن تكون عليها.</p>

<section id="intro" class="card intro">
<label>الاسم (اختياري)</label><input id="name" placeholder="اكتب اسمك">
<p class="hint" style="margin-top:15px">لا نستخدم تاريخ الميلاد. كل سؤال له عدّاد مستقل.</p>
<button class="next" onclick="start()">ابدأ الاختبار</button>
</section>

<section id="quiz" class="card hidden">
<div class="meta"><span id="num"></span><span class="timer">⏱ <span id="time">20</span> ث</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="q" class="q"></div><div class="hint">اختر إجابة واحدة</div>
<div id="opts"></div>
<button id="next" class="next" disabled onclick="advance()">التالي</button>
</section>

<section id="result" class="card result hidden"></section>
</div>

<script>
const questions=[
["أميل إلى بدء الحديث مع أشخاص لا أعرفهم في موقف اجتماعي.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أستمتع بأن يكون يومي مليئًا بالتفاعل مع الآخرين.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أفضّل العمل بهدوء بمفردي لفترات طويلة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحافظ على هدوئي عندما تسوء الأمور بشكل مفاجئ.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["بعد موقف مزعج، أظل أفكر فيه لفترة طويلة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أستطيع العودة إلى توازني بسرعة بعد الضغط.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحرص على إنهاء المهام في وقتها حتى لو لم يراقبني أحد.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحب أن تكون الأشياء مرتبة ومخططًا لها مسبقًا.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أؤجل المهام أحيانًا رغم معرفتي بأهميتها.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أهتم بمشاعر الآخرين حتى عندما أختلف معهم.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أميل إلى إعطاء الناس مساحة لفهم وجهة نظرهم.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["إذا اختلف معي شخص، أركز أكثر على إثبات أنني على حق.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أستمتع بتجربة أفكار أو طرق جديدة حتى لو لم أجربها من قبل.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أشعر بالفضول تجاه موضوعات مختلفة عن اهتماماتي المعتادة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أفضل الطرق المألوفة على تجربة شيء جديد دون حاجة واضحة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["عندما أضع هدفًا، أستمر في متابعته حتى بعد انخفاض الحماس الأول.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أشعر بالارتياح عندما أتحمل مسؤولية قرار مهم.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحتاج عادةً إلى وقت طويل قبل اتخاذ قرار حتى لو كانت المعلومات كافية.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أستطيع تغيير خطتي عندما تظهر معلومات أو ظروف جديدة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أجد صعوبة في تقبل تغيير الخطط في اللحظة الأخيرة.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أفضل التفكير في عدة احتمالات قبل اختيار حل واحد.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أميل إلى ملاحظة التفاصيل التي قد يتجاهلها الآخرون.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أشعر بطاقة أكبر عندما أكون وسط مجموعة من الناس.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحتاج إلى وقت منفرد لاستعادة طاقتي بعد يوم اجتماعي طويل.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["عندما أتعرض للنقد، أستطيع الاستفادة منه دون أن يؤثر في مزاجي طويلًا.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أتعامل مع الأخطاء باعتبارها فرصة لفهم ما يمكن تحسينه.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["إذا كانت المهمة مهمة، أضع لها خطوات واضحة قبل البدء.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أميل إلى إنهاء ما بدأته قبل الانتقال إلى شيء آخر.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحاول الوصول إلى حل يراعي مصلحة جميع الأطراف عند الخلاف.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أحب النقاشات التي تجعلني أعيد النظر في أفكاري.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"],
["أشعر بالملل إذا كانت كل الأمور تسير بالطريقة نفسها دون أي تجديد.","أوافق بشدة","أوافق","محايد","لا أوافق","لا أوافق بشدة"]
];

const dims={E:"الانبساط والتفاعل الاجتماعي",A:"التوافق والتعاون",C:"الضمير الحي والتنظيم",N:"الاستقرار الانفعالي",O:"الانفتاح على الخبرة"};
const map=[
"E","E","E","N","N","N","C","C","C","A","A","A","O","O","O","C","E","C","O","N","O","C","E","E","N","N","C","C","A","O","O"
];
// reversed items by question index (0-based)
const rev=new Set([2,4,8,11,14,17,19]);
let i=0, answers=[], startTime=0, timer=null, seconds=20, elapsed=[];

function start(){
 document.getElementById("intro").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
}
function render(){
 const q=questions[i];
 document.getElementById("num").textContent=`السؤال ${i+1} من ${questions.length}`;
 document.getElementById("fill").style.width=((i/questions.length)*100)+"%";
 document.getElementById("q").textContent=q[0];
 const box=document.getElementById("opts"); box.innerHTML="";
 for(let k=1;k<=5;k++){
   const b=document.createElement("button"); b.className="option"; b.textContent=q[k];
   b.onclick=()=>select(k,b); box.appendChild(b);
 }
 document.getElementById("next").disabled=true;
 seconds=20; document.getElementById("time").textContent=seconds;
 startTime=performance.now(); clearInterval(timer);
 timer=setInterval(()=>{seconds--;document.getElementById("time").textContent=seconds;if(seconds<=0){clearInterval(timer);autoAdvance()}},1000);
}
function select(v,b){
 answers[i]=v; document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected")); b.classList.add("selected");
 document.getElementById("next").disabled=false;
}
function autoAdvance(){ if(answers[i]==null) answers[i]=3; advance(); }
function advance(){
 clearInterval(timer); elapsed[i]=Math.round((performance.now()-startTime)/100)/10;
 if(i<questions.length-1){i++;render()} else finish();
}
function pct(x){return Math.round(x);}
function finish(){
 clearInterval(timer);
 document.getElementById("quiz").classList.add("hidden");
 const s={E:0,A:0,C:0,N:0,O:0}, count={E:0,A:0,C:0,N:0,O:0};
 answers.forEach((v,idx)=>{
   let val=v; if(rev.has(idx)) val=6-v;
   const d=map[idx]; s[d]+=val; count[d]++;
 });
 const p={}; Object.keys(s).forEach(d=>p[d]=Math.round(((s[d]-count[d])/(count[d]*4))*100));
 const avg=elapsed.reduce((a,b)=>a+b,0)/elapsed.length;
 const consistency=Math.max(68,Math.min(99,Math.round(100-Math.abs(answers.filter((v,idx)=>v===3).length-questions.length*.18)*.7)));
 const highest=Object.keys(p).sort((a,b)=>p[b]-p[a])[0];
 const descriptions={
 E:"تميل إلى التفاعل والمبادرة الاجتماعية، مع قابلية أعلى للاستفادة من النقاش والتواصل عندما يخدم الهدف.",
 A:"تميل إلى التعاون ومراعاة الآخرين وبناء حلول متوازنة عند الاختلاف.",
 C:"تميل إلى التنظيم والمتابعة وتحويل الأهداف إلى خطوات عملية، مع اهتمام بالالتزام.",
 N:"تظهر لديك قدرة جيدة على تنظيم الاستجابة الانفعالية، مع اختلاف طبيعي حسب الموقف.",
 O:"تميل إلى الفضول وتقبل الأفكار الجديدة والنظر في أكثر من احتمال قبل الاستقرار على حل."
 };
 let name=document.getElementById("name").value.trim()||"المشارك";
 let html=`<h2>التحليل المختصر</h2><p style="text-align:center;color:#aaa">النتيجة مبنية على إجاباتك في نموذج السمات الخمس الكبرى، وليست تشخيصًا نفسيًا.</p>
 <div class="scoregrid">`;
 for(const d of Object.keys(p)) html+=`<div class="metric"><b><span>${dims[d]}</span><span>${p[d]}%</span></b><div class="track"><i style="width:${p[d]}%"></i></div></div>`;
 html+=`</div><div class="box"><h3>الخلاصة</h3><p><strong>${name}</strong> يظهر لديه أعلى بُعد في <strong>${dims[highest]}</strong>. ${descriptions[highest]}</p></div>
 <div class="box"><h3>زمن الإجابة</h3><p>متوسط زمن الإجابة: <strong>${avg.toFixed(1)} ثانية</strong> لكل سؤال. إجمالي الاختبار: <strong>${Math.round(elapsed.reduce((a,b)=>a+b,0))} ثانية</strong>.</p></div>
 <div class="box"><h3>ملاحظة منهجية</h3><p>النتيجة تصف نمط استجاباتك في هذا الاختبار الذاتي. للحصول على تقييم نفسي مُتحقق منه سريريًا يلزم استخدام أداة معيارية معتمدة وتفسير مختص.</p></div>
 <button class="restart" onclick="location.reload()">إعادة الاختبار</button>`;
 const r=document.getElementById("result");r.innerHTML=html;r.classList.remove("hidden");
}
</script>
</body>
</html>
